dataset:
    augmentation:
        add_edge: 0.0
        add_noise: 0.0
        add_self_loops: false
        drop_edge: 0.0
        drop_feature: 0.0
        pd1: 0.3
        pd2: 0.3
        pm1: 0.2
        pm2: 0.2
    dir: ../data/CORA/
    n_clusters: 7
    name: CORA
    num_edges: 5278
    num_features: 1433
    num_nodes: 2708
device: cuda
evaluate:
    acc: true
    ari: true
    com: true
    each: false
    f1: true
    gre: true
    hom: true
    nmi: true
    pur: true
    sc: true
logger:
    dir: ./log/CORA/
    mode: both
    name: CORA
model:
    dims:
    - 256
    - 64
train:
    gam: 1.0
    lam: 1.0
    lr: 1e-3
    max_epoch: 1
    rounds: 1
    s: 0.6
    seed: -1
    tau: 0.1
    weight_decay: 1e-5
visualize:
    dir: ./visualization/CORA/
    heatmap: true
    loss: true
    tsne: true
    umap: true
    when: end
