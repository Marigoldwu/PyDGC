WIKI:
    device: cuda
    logger:
        name: WIKI
        mode: both
        dir: ./log/WIKI/
    dataset:
        dir: ../data/WIKI/
        augmentation:
            add_self_loops: false
            pd1: 0.0
            pd2: 0.6
            pm1: 0.1
            pm2: 0.0
            drop_edge: 0.0
            drop_feature: 0.0
            add_edge: 0.0
            add_noise: 0.0
    model:
        dims: [ 256, 256 ]
    train:
        seed: 0
        rounds: 10
        max_epoch: 200
        lr: 1e-3
        weight_decay: 1e-5
        lam: 1.0
        gam: 1.0
        s: 0.6
        tau: 0.1
    visualize:
        tsne: true
        umap: true
        heatmap: true
        loss: true
        dir: ./visualization/WIKI/
        when: end
    evaluate:
        each: false
        acc: true
        nmi: true
        ari: true
        f1: true
        hom: true
        com: true
        pur: true
        sc: true
        gre: true
